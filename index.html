  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join your crew</title>
    <style>
      /* Snowfield (ios/Packages/SkiDesign, Tokens.swift): the page, the card, the words; the action is the night navy */
      :root { --bg: #F4F6F8; --card: #FFFFFF; --text: #142336; --muted: #3E5062; --action: #142336; --on-action: #FFFFFF; --link: #22618A; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0B1522; --card: #142336; --text: #F3F6F8; --muted: #C5D1DA; --action: #F3F6F8; --on-action: #142336; --link: #8EC5EA; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
        color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { background: var(--card); border-radius: 22px; padding: 28px 24px; margin: 16px; max-width: 360px; }
      .brand { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; font-weight: 700; font-size: 20px; }
      .brand img { width: 56px; height: 56px; border-radius: 13px; }
      h1 { font-size: 24px; line-height: 1.2; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      a.button { display: block; text-align: center; padding: 15px; border-radius: 28px; background: var(--action);
        color: var(--on-action); text-decoration: none; font-weight: 600; margin-bottom: 10px; }
      a.secondary { background: transparent; color: var(--link); border: 1px solid var(--link); }
      .code { font-size: 14px; margin: 16px 0 0; }
      .code b { color: var(--text); font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    </style>

      <h1>You’re invited to ski together</h1>
      <p id="info">Open this link on your iPhone to join the crew in Pisteo.</p>
      <a class="button" id="open" href="#">Open in Pisteo</a>
      <a class="button secondary" id="install" href="#">Get the app (TestFlight)</a>
      <p class="code" id="code" hidden>If the button doesn’t open the app: open Pisteo, go to Friends, tap Join with an invite and paste this code: <b id="code-value"></b></p>
    </main>
    <script>
      // Invite links look like https://<host>/?c=<invite code> (the app's inviteLink()). The
      // TestFlight link comes with the paid Apple membership.
      const TESTFLIGHT_URL = '';
      const code = new URLSearchParams(location.search).get('c');
      const open = document.getElementById('open');
      const install = document.getElementById('install');
      if (code && /^[A-Za-z0-9_-]{16,64}$/.test(code)) {
        open.href = 'pisteo://join/' + encodeURIComponent(code);
        document.getElementById('code-value').textContent = code;
        document.getElementById('code').hidden = false;
      } else {
        document.getElementById('info').textContent = 'This invite link is not complete. Ask your crew for a new one.';
        open.style.display = 'none';
      }
      if (TESTFLIGHT_URL) install.href = TESTFLIGHT_URL;
      else install.style.display = 'none';
    </script>
